omFormatting":115,"bio":12,"bioFields":12,"rosterDisplayTitle":12,"seasonSlug":12,"images":12,"hasWePlayedMoments":115,"historicalFields":12,"displayFields":12,"settings":12,"rankedBioFields":12,"statsSeasons":12,"birthDate":12,"socialMedia":5872,"academicYearNumber":159,"lastUpdated":5873},8099,23782,"Pedicano","Ho-Ho-Kus, N.J.","Delbarton","91",{"mediaCaption":12,"url":5856,"absoluteUrl":5857,"altText":4572,"title":12,"creditName":12},"\u002Fimages\u002F2025\u002F12\u002F13\u002FPedicano_Will.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2025\u002F12\u002F13\u002FPedicano_Will.jpg",{"id":235,"title":108,"shortDisplay":245,"shortName":248,"abbrev":245,"facebookPage":-1,"globalSportGender":158,"globalSportId":247,"globalSportShortName":-1,"globalSportNameSlug":249,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"\u002Fsports\u002Fmens-lacrosse\u002Froster\u002Fwill-pedicano\u002F23782",[5861,5862,5863,5864,5865,5866,5867,5868,5869,5870,5871],{"icon":4157,"oldIcon":4578,"platformName":685,"url":12,"userName":12},{"icon":4150,"oldIcon":4580,"platformName":692,"url":12,"userName":12},{"icon":4164,"oldIcon":4582,"platformName":679,"url":12,"userName":12},{"icon":4584,"oldIcon":4585,"platformName":3459,"url":12,"userName":12},{"icon":4587,"oldIcon":4588,"platformName":4589,"url":12,"userName":12},{"icon":4591,"oldIcon":4592,"platformName":4593,"url":12,"userName":12},{"icon":4595,"oldIcon":4596,"platformName":4597,"url":12,"userName":12},{"icon":4599,"oldIcon":4600,"platformName":4601,"url":12,"userName":12},{"icon":4603,"oldIcon":4604,"platformName":4605,"url":12,"userName":12},{"icon":4607,"oldIcon":4608,"platformName":4609,"url":12,"userName":12},{"icon":4611,"oldIcon":4612,"platformName":4613,"url":12,"userName":12},{"Twitter":12,"Instagram":12,"Facebook":12,"YouTube":12,"Snapchat":12,"TikTok":12,"Cameo":12,"Twitch":12,"LinkedIn":12,"Shop":12,"INFLCR":12},"2026-09-10T13:44:09.793",[5875,5906,5931,5957],{"id":5876,"title":5877,"firstName":5878,"lastName":5879,"image":5880,"sport":5885,"positionShort":-1,"call_to_action":-1,"bio":5886,"twitter":18,"images":12,"displayFields":5887,"latestBioId":5876,"email":5891,"phone":5892,"url":12,"staffId":5893,"socialMediaR":5894,"custom1":18,"custom2":18,"custom3":18,"custom4":18},5325,"Head Coach","John","Danowski",{"altText":5881,"url":5882,"absoluteUrl":5883,"creditName":5884,"mediaCaption":12,"title":5881},"John Danowski","\u002Fimages\u002F2023\u002F1\u002F13\u002Fmlax_duke_headshots_ledonne_20230112-11.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2023\u002F1\u002F13\u002Fmlax_duke_headshots_ledonne_20230112-11.jpg","Duke Athletics",{"id":235,"title":108,"shortDisplay":245,"shortName":248,"abbrev":245,"facebookPage":-1,"globalSportGender":158,"globalSportId":247,"globalSportShortName":-1,"globalSportNameSlug":249,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"\u003Cp>\u003Cstrong>Taking Duke and Himself to the Top\u003C\u002Fstrong>\u003Cbr \u002F>\r\nCemented as one of the top coaches in college lacrosse, John Danowski has led the Duke men’s lacrosse team to unprecedented success and himself to the top of the Division I men’s lacrosse wins list during his tenure in Durham. Danowski was introduced as Duke’s eighth head men’s lacrosse coach July 21, 2006 and quickly led the Blue Devils to some of the most successful lacrosse seasons in school history and ultimately to three NCAA Championships – 2010, 2013 and 2014.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn Danowski’s 17 years at the helm of the Blue Devils lacrosse program, he has compiled an impressive 240-74 record in leading Duke to nine ACC regular season titles, four ACC tournament titles, 12 appearances in the NCAA semifinals, including eight straight from 2007-14, six in the NCAA title match and ultimately to the 2010, 2013 and 2014 national titles. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nThe 2014 NCAA crown put Danowski among a small group of nine coaches to win three national titles and among eight to capture consecutive crowns. Meanwhile, Duke’s run of eight straight NCAA semifinals rank as the second most of any program since 2000 with Syracuse. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn 2019, Danowski made history by becoming the first Division I head coach and only the third across all three divisions to reach 400 career wins when Duke beat Furman 17-9. He currently ranks  third all-time among all NCAA lacrosse coaches in the sports history. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cstrong>Breaking Through for the First\u003C\u002Fstrong>\u003Cbr \u002F>\r\nAfter three straight trips to Championship Weekend, which included a runner-up finish in 2007, the Blue Devils broke through for their first NCAA Men’s Lacrosse title in 2010 in dramatic fashion. On the heels of Max Quinzani’s last-second goal that pushed Duke past Virginia 14-13, the championship game against Notre Dame was a much lower scoring affair as the two teams slogged their way to a 5-5 score after 60 minutes. Tension was high as CJ Costabile lined up at the faceoff X to start the sudden victory overtime. The talented long pole, won the draw, raced straight down the field and fired a shot past the Notre Dame goalie all in a span of five seconds to give Duke its first championship. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cstrong>Going Back to Back \u003C\u002Fstrong>\u003Cbr \u002F>\r\nThe Blue Devils, a regular at Championship Weekend, accomplished a feat few programs had done in NCAA men’s lacrosse history – they went back-to-back. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDuke struggled in the first month of the 2013 season, starting 2-4 with the two wins against Jacksonville and Mercer.  Dropping out of the top 25, the Blue Devils started to right the ship with a 9-8 victory over Loyola and rattled off nine straight wins before falling in the ACC semifinal to North Carolina. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nRefocused, Duke edged Loyola in double overtime in the NCAA opening round and rode that momentum all the way to Memorial Day to vie for a second title. Syracuse jumped out to a 5-0 lead, but the combination of Brendan Fowler’s dominance at the faceoff X and Jordan Wolf on attack sent the Blue Devils on a 12-1 run en route to a 16-10 triumph. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDanowski’s coaching job in 2013 did not go unnoticed as he was voted the IMCLA Howdy Myers Man of the Year as well as one of five nominees for that year’s Coach of the Year ESPY. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nReturning a battle-tested group, the 2014 season was much less dramatic as Duke compiled a 17-3 record and a third NCAA title. The Blue Devils lost a couple of early season games, but thrived on the next man up mentality as injuries compounded down the stretch. Duke, after suffering another ACC semifinal loss, cruised to the semifinals with 20-9 and 19-11 victories. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nThe Blue Devils remained in full control at Championship Weekend, with a 15-12 win over Denver and an 11-9 triumph against Notre Dame – a game that was not as close as the score might indicate. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDanowski became the eighth coach in NCAA Division I history to win consecutive crowns, while Duke became the first back-to-back champions since Syracuse in 2008 and 2009 and just the second school to do so since 2000. Duke is one of six programs to win at consecutive titles since the first one was awarded in 1971. Danowski is currently one of three active coaches to be able to lay claim consecutive NCAA crowns to his name. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cstrong>Missing the Tournament and Coming Back Stronger\u003C\u002Fstrong>\u003Cbr \u002F>\r\nThe Blue Devils, finishing the 2023 season with an 11-6 overall record and a final RPI of nine, were not among the 16 teams selected to the NCAA Tournament. The streak of 14 consecutive berths into the postseason came to and end. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nThe absence was short as Duke returned to the top of the sport in 2023, climbing to No. 1 midway through the season and winning the ACC title. The Blue Devils advanced to the NCAA Championship game before falling to a seasoned Notre Dame squad. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nLed by the efforts of Duke’s attack trio of Brennan O’Neill, Dyson Williams and Andrew McAdorey, the Blue Devils ranked fifth nationally in scoring offense. On the other end of the field, first-team All-American Kenny Brower anchored the close defense that finished second in the ACC with a 10.89 goals against average.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cstrong>Coaching Through a Unique and Unprecedented Time\u003C\u002Fstrong>\u003Cbr \u002F>\r\nThe 2020 season certainly had its ups and downs on the field during the first month of the campaign as the Blue Devils lost to Air Force to start the year, but beat Denver on the road two weeks later. Duke was starting to hit is stride during spring break when everything changed. It was just a matter of hours really as the team lined up for the team photo and then moments later the players learned the season had been postponed and eventually canceled in the ensuing weeks. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nThrough it all, Danowski did his best to continue coaching and leading this group of young men virtually. He organized team meetings where he would bring in different speakers from all areas - sports, business, academics, etc. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn addition, Danowski joined forces with Duke’s Director of Sports Pyschology Greg Dale and created a virtual program called “The Art of Coaching”. The pair discussed everything that goes into coaching and team building, leadership and beyond. It grew to bring on special guest coaches from Duke as well as other Division I head coaches. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nWhen the Blue Devils returned to campus in the fall of 2020 life was anything but normal as COVID-19 restrictions were in place to allow Duke to return to play. However, Danowski and his staff made the most of it and worked towards creating a great experience in the fall with the creationg of the Duke Outdoor Lacrosse League. The players picked teams and they battled each other in intrasquad scrimmages at the end of every week and then convened on the field after for an outdoor meal in order to develop more team chemistry. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDanowski and the Blue Devils navigated all of the ups and downs that came along the way of a season during the spring and clinched a share of the ACC title. Players stepped in when others were sidelined due to a positive COVID-19 test or any other injury and the Blue Devils went on to earn a spot at Championship Weekend.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cstrong>Mentoring the Best\u003C\u002Fstrong>\u003Cbr \u002F>\r\nA winner of nearly 80 percent of his games at Duke, the individual awards Blue Devil players have garnered is equally impressive. In 17 seasons, Danowski has mentored 100 All-America selections, 53 All-ACC choices, 19 ACC major award winners, three Tewaaraton Trophy winners, two different USILA Most Outstanding Player award winner, a pair of USILA Attackman of the Year honorees, two USILA Defenseman of the Year awards, three USILA Midfielder of the Year award recipients and 35 USILA Scholar All-America picks. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDuke’s 100 All-America picks under Danowski are the most of any program since 2007. Under Danowski, three Blue Devils, Matt Danowski in 2007, Ned Crotty in 2010 and Brennan O’Neill in 2023 have won the coveted Tewaaraton Award. Overall, the veteran head coach has mentored four Tewaaraton Award recipients with Doug Shanahan of Hofstra winning the inaugural trophy in 2001. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nHe is one of two coaches to have coached four winners of the prestigious honor and one of three to have at least two players in the elite fraternity. Duke has had 12 finalists for the award since 2007, the most of any program. In all, Danowski has coached 14 Tewaaraton Award finalists. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn addition to the three Tewaaraton Award winners, Danowski has mentored two overall Player of the Year honorees, three different Attackman of the Year winners, three national Midfielder of the Year honors and two National Defenseman of the Year accolades. Thirteen Blue Devils have garnered an ACC Player of the Year award under Danowski. Few programs across the country can claim to such dominance both in conference and nationally. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nOverall in his 40-plus years coaching career, Danowski has coached 134 All-Americans, 20 conference MVPs and 153 all-conference choices. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cstrong>Coaching Honors\u003C\u002Fstrong>\u003Cbr \u002F>\r\nThe honors haven’t been unique to Danowski’s players. He has garnered countless awards for his success on the sidelines. The first of Danowski’s major coaching awards came in 1993 when he was selected as the NCAA Division I National Coach of the Year after leading Hofstra to its first NCAA Tournament since 1978. The Pride finish the season with a 10-6 overall record and No. 11 national ranking after advancing to the NCAA quarterfinals. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nHe collected four conference coach of the year awards during his time at Hofstra, being recognized as the top coach in the North Atlantic Conference in 1995 and 1996. Danowski garnered Colonial Athletic Association Coach of the Year accolades in 2002 and again in 2006 prior to being hired to lead the Blue Devils. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nHe also is a three-time winner of the Joseph “Frenchy” Julien Sportsmanship Award (1988, 1989 & 1994) presented by the Metropolitan New York Officials Association and received the James Adams Sportsmanship Award from the National Intercollegiate Lacrosse Officials Association in 1994. Amidst his time at Hofstra and with four conference coach of the year honors to his credit, Danowski was inducted into the Long Island Lacrosse Hall of Fame in 2001.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDanowski left his mark on the ACC immediately upon arrival at Duke, leading the Blue Devils to the ACC title and the ACC Coach of the Year award. He was voted as the top coach by his ACC peers again in 2011, 2012 and 2023. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nOn the national landscape, Danowski’s efforts in guiding Duke to its first NCAA title in 2010 earned him the USILA National Coach of the Year award. One of the most admired leaders in the sport, he was voted the IMCLA Howdy Myers Man of the Year, presented to the coach who has contributed to the game of lacrosse in a capacity over and above the normal efforts and in so doing, has shown unselfish and untiring devotion to the game, in 2013 and 2014.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cstrong>Duke in the Classroom and Beyond\u003C\u002Fstrong>\u003Cbr \u002F>\r\nWhile the success on the field is unsurpassed in Duke lacrosse history, the student-athlete’s excellence in the classroom also is unrivaled. The Blue Devils consistently lead the ACC in All-ACC Academic picks as well as players on the ACC Academic Honor Roll. In 2023, every single member of the team finished the academic year with at least a 3.0 – and 36 who earned at least a 3.5 GPA. The team recorded a 3.58 team GPA in the spring of 2023 and has never had a team GPA below 3.0 in any semester. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nEducation has been a cornerstone in Danowski’s life, as he started his career as a teacher and was raised by educators, and he encourages his players to always continue learning. They have followed suit as 85 Blue Devils since 2007 have gone on to earn at least one advanced degree after garnering an undergraduate degree at Duke. Whether it is a master’s degree from Duke’s Fuqua School of Business, medical or law school, the learning off the lacrosse field is paramount to being a Duke Blue Devil. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cstrong>Duke in the Pros \u003C\u002Fstrong>\u003Cbr \u002F>\r\nThe success on the lacrosse field doesn’t stop in Durham as Blue Devils have gone on to excellent careers at the next level in Major League Lacrosse and now the Premier Lacrosse League. Forty-three Blue Devils have been selected in either the MLL or PLL draft since 2008. Five have won MLL major awards and five different Blue Devils have won MLL titles. Most recently, CJ Costabile became the first Blue Devil to win both an MLL and a PLL title in his professional career. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nNed Crotty was the first Blue Devil to be drafted No. 1, while Myles Jones followed suit in 2016. Overall, 10 Blue Devils have been chosen in the top five of the MLL draft. Brad Smith, was Duke’s first selection in the inaugural PLL draft as the No. 9 pick. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cstrong>Team USA\u003C\u002Fstrong>\u003Cbr \u002F>\r\nIn November of 2016, U.S. Lacrosse announced Danowski as the next coach to lead Team USA as it prepared for the 2018 Federation of International Lacrosse (FIL) Championship. Danowski quickly went to work in establishing a culture and coaching some of the world’s best players. He was faced with the arduous task of putting the U.S. back on top after a loss to Canada in 2014.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn a testament to what Danowski has built during his time at Duke, eight former Blue Devils were among the 49 selected out of the pool of 71 to vie for a spot on the World Championship roster and ultimately four Duke players - Ned Crotty, Matt Danowski, Will Haus and Jordan Wolf –  donned the Team USA jersey in July of 2018. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nAfter nearly two years of working and building the U.S. team in his vision, Danowski headed East to Israel in search of gold. The Red, White and Blue worked their way through pool play with relative ease and earned the top seed in the knockout round where it beat Australia in the semifinal. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nThe rematch with Canada in the gold medal game did not disappoint as the United States jumped out to an early lead before Canada roared back in front. The back and forth continued in the second half with former Blue Devil Will Haus and the U.S. defense digging in and holding Canada to just two goals in the final two quarters. The Canadians took an 8-7 lead with five minutes left, but the resilient U.S. squad tied it 8-8 and then with one second left after a Danowski-called timeout Tom Schreiber threw in the winner for the victory. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nHis success on the international stage led U.S. Lacrosse to make an unprecedented decision in keeping Danowski at the helm for a second term. He is the first coach in the history of the U.S. men’s program to serve more than one term. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDanowski stayed the course with the United States and five years later, the U.S. Men’s National Team captured gold once again with a thrilling victory over Canada. In true Danowski fashion, he created a team out of a collection of immensely talented individuals. Three Blue Devils suited up in the red, white and blue - JT Giles-Harris, Brennan O’Neill and Michael Sowers – and were instrumental in the team’s success. O’Neill, the lone collegiate player on the team, was named the tournament’s Most Valuable Player for his 20 points over the course of the tournament. He had five goals in the gold medal victory. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn addition to Danowski’s success in coaching the United States, Blue Devils have fared well individually. Crotty has been on three national teams, winning gold in 2010 and 2018. Matt Zash joined Crotty on the 2010 team with former Blue Devil Kevin Cassese, while Dave Lawson wore the stars and stripes in 2014.  In addition, 10 Blue Devils since 2008 have played in the U19\u002FU21 World Championships with Team USA. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cstrong>Prior to Duke\u003C\u002Fstrong>\u003Cbr \u002F>\r\nThe Danowski era at Hofstra produced 34 USILA All-America selections, including first-team choices Brian Spallina (2000), Doug Shanahan (2001), Nicky Polanco (2002), Brett Moyer (2006) and Chris Unterstein (2006). In addition, Shanahan was the of the Tewaaraton Trophy winner as the nation’s top player in 2001. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn addition, Hofstra has sent 30 players to the annual North-South All-Star Game since 1986, with Shanahan (2001) and Moyer (2006) earning game MVP honors. Former Hofstra standout Blake Miller, a member of the 1998 United States squad that captured the world title and the 2004 MLL Offensive Player of the Year, Polanco and Shanahan played for the United States squad at the 2006 International Lacrosse Federation World Championships in Ontario, Canada. Polanco was a two-time MLL Defensive Player of the Year (2004 & 2005) while Shanahan was the MVP of the 2002 ILF World Championships in Perth, Australia.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nOverall, Danowski finished with a 192-123 record in his 21 seasons with the Pride. He was named the conference coach of the year four times and won the 2006 CAA title en route to the NCAA quarterfinals. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDanowski spent three seasons as the head coach at Long Island University-C.W. Post, helping the Pioneers to a 27-16 (.628) ledger from 1983-85. He received his start in coaching in 1982 as an assistant coach at LIU-C.W. Post in 1982.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cstrong>As a Scarlet Knight\u003C\u002Fstrong>\u003Cbr \u002F>\r\nA 1976 graduate of Rutgers University where he earned a Bachelor of Science degree in environmental science\u002Feducation, Danowski was a four-year letterman in lacrosse and continues to hold several Scarlet Knight records. He established school single-game records for assists (13 vs. Penn State, 1973) and total points (14 vs. Penn State, 1974) and a single-season standard for assists with 54 in 1973. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nHe currently ranks second on Rutgers’ all-time list for assists (120) and is eighth in total points (177). Danowski, who helped the Scarlet Knights to NCAA Tournament appearances in 1973 and 1974, was a three-time recipient of the program’s Sasser Award, an honor presented annually to the team’s leader in assists. Born March 12, 1954 in Bronxville, N.Y., Danowski went on to earn a master’s degree in counseling\u002Fcollege student development from LIU-C.W. Post in 1978.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cstrong>Family History\u003C\u002Fstrong>\u003Cbr \u002F>\r\nDanowski’s father, Ed, was an All-America halfback on the gridiron at Fordham in 1932 and 1933 who later starred for the New York Giants in the National Football League. The elder Danowski led the NFL in passing in 1935 and 1938, earning All-NFL honors in both of those seasons, and guided the Giants to league championships in 1934 and 1938. He later served as the head football coach at his alma mater from 1946-54.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nPersonal\u003Cbr \u002F>\r\nDanowski and his wife, Patricia, have two children, Kate, a former lacrosse letterwinner and 2005 graduate of Quinnipiac University, and Matt, a 2008 Duke graduate and former captain of the lacrosse program, and five grandchildren. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n \u003C\u002Fp>\r\n",{"staff_title":5888,"staff_email":5889,"staff_phone":5890,"staff_twitter":-1},"Title","Email","Phone","estephenson@duaa.duke.edu","(919) 668-5791",117,[5895,5896,5897,5898,5899,5900,5901,5902,5903,5904,5905],{"platformName":685,"userName":12,"url":12,"icon":4157,"oldIcon":4578},{"platformName":692,"userName":12,"url":12,"icon":4150,"oldIcon":4580},{"platformName":679,"userName":12,"url":12,"icon":4164,"oldIcon":4582},{"platformName":3459,"userName":12,"url":12,"icon":4584,"oldIcon":4585},{"platformName":4589,"userName":12,"url":12,"icon":4587,"oldIcon":4588},{"platformName":4593,"userName":12,"url":12,"icon":4591,"oldIcon":4592},{"platformName":4597,"userName":12,"url":12,"icon":4595,"oldIcon":4596},{"platformName":4601,"userName":12,"url":12,"icon":4599,"oldIcon":4600},{"platformName":4605,"userName":12,"url":12,"icon":4603,"oldIcon":4604},{"platformName":4609,"userName":12,"url":12,"icon":4607,"oldIcon":4608},{"platformName":4613,"userName":12,"url":12,"icon":4611,"oldIcon":4612},{"id":5907,"title":5908,"firstName":5909,"lastName":5879,"image":5910,"sport":5914,"positionShort":-1,"call_to_action":-1,"bio":5915,"twitter":18,"images":12,"displayFields":5916,"latestBioId":5907,"email":5917,"phone":5892,"url":12,"staffId":5918,"socialMediaR":5919,"custom1":18,"custom2":18,"custom3":18,"custom4":18},5327,"Associate Head Coach","Matt",{"altText":5911,"url":5912,"absoluteUrl":5913,"creditName":5884,"mediaCaption":12,"title":5911},"Matt Danowski","\u002Fimages\u002F2023\u002F1\u002F13\u002Fmlax_duke_headshots_ledonne_20230112-2.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2023\u002F1\u002F13\u002Fmlax_duke_headshots_ledonne_20230112-2.jpg",{"id":235,"title":108,"shortDisplay":245,"shortName":248,"abbrev":245,"facebookPage":-1,"globalSportGender":158,"globalSportId":247,"globalSportShortName":-1,"globalSportNameSlug":249,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"\u003Cp>One of the best players in Duke men’s lacrosse history, Matt Danowski enters his 15th season with the program. In his 14 seasons with the offense, Danowski has mentored some of Duke’s top scorers, including Jordan Wolf, Justin Guterding, Dyson Williams and Brennan O’Neill.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nSince arriving on campus in the summer of 2012, the Blue Devils have featured one of the nation’s top offenses and some of the most prominent attackmen and offensive players in the game with O’Neill joining the ranks as the 2023 Tewaaraton Award winner. Overall, a Duke attackman has been a Tewaaraton Award finalist five times during Danowski’s tenure.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDanowski’s offenses are some of the most exciting in lacrosse, with the Blue Devils ranking in the top five in scoring offense in nine of his 14 years on the sideline them. Duke has had five first-team All-American attackmen and 17 All-America recognitions since 2013.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nOff the lacrosse field, Danowski has used his experience as a Duke student-athlete to help the Blue Devils navigate the rigors of balancing athletics and academics at Duke. The Blue Devils regularly lead the ACC in All-Academic Team members. In each of the 14 seasons, the team has finished with at least a 3.0 team grade point average.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cstrong>Breaking Down Danowski’s 14 Seasons\u003C\u002Fstrong>\u003Cbr \u002F>\r\nIn 2026, Danowski was instrumental in helping All-American midfielder Benn Johnston make the transition to the attack position. Through diligent instruction and guidance from Danowski, Johnston led the Blue Devils in scoring en route to earning honorable mention All-America accolades in his first year at the position.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nAmong the many highlights in Danowski’s time at Duke, the 2024 season saw one of the best as O’Neill and Williams join rarefied air as 200-goal scorers in the same season. Danowski coached three of the four Blue Devils to reach the benchmark, including record holder Guterding. O’Neill finished his career ranked fifth in NCAA history in goals and tied for 18th in career points. He also was one of four players in NCAA history to register 200 goals and 100 assists in his career.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn his 10th and 11th seasons, Danowski continued to manage the growth of O’Neill as the talented attackman joined the elite 200-point scorer ranks and is on pace to become the fourth Blue Devil to reach 300 career points. O’Neill garnered his third All-ACC honor was named the Raymand J. Enners Award winner as the nation’s top player along with the Tewaaraton Award.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nAdditionally, Williams turned in his best season as a Blue Devil in 2023, leading Duke with 60 goals - one of six different Blue Devils to score 60 in a season. In 2022, Nakeie Montgomery became the first midfielder since Myles Jones to be named to the All-America first team in consecutive seasons. Montgomery finished his career ranked 30th at Duke in career points.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDanowski melded a collection of extremely talented players in 2021 as Duke landed three attackmen and a midfielder on the All-America squads. He helped work into Duke’s offense the nation’s most sought after transfer in Michael Sowers as well as the country’s top-ranked freshman with O’Neill. After a stellar start to his career as a freshman on attack, Williams moved into the midfield in 2021 where he contributed 23 goals. Also in the midfield, Montgomery dished a career-high 22 assists on his way to earning All-America first team recognition.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDespite playing just eight games in 2020, Williams flourished under Danowski’s watch. The Ontario native was on pace to battle for the Duke rookie scoring record, while the Blue Devil offense averaged 15.25 goals per game to rank 11th nationally.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn 2018, Duke’s offense was the best in the ACC and ranked fourth nationally with Guterding leading the way.  With Danowski providing daily inspiration and guidance, Guterding rewrote the NCAA record book, breaking the career goals record with 212 goals. Netting 66 goals and 113 points overall, Guterding led the nation in goals (3.30\u002Fgame) and was third in points (5.65).\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nAfter becoming a household name in his rookie season, Justin Guterding continued to rewrite the records book with Danowski as a mentor. He led the team in scoring with 71 points to become the first Blue Devil to score 70-plus points in each of his first two seasons. He also became the fastest Blue Devil to 100 career points, reaching the benchmark in 25 games. Guterding’s play earned the attackman his first All-ACC and All-America honors.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn 2015, following the departure of Tewaaraton Finalist Jordan Wolf, Duke was fourth nationally in scoring offense at 14.28 goals per game. Duke led the ACC and was fourth again nationally with a 13.50 goals per game average. Guterding had an outstanding rookie season that year, with the Long Island native finishing his first year with 52 goals and 70 points overall, the second most by any freshman in Division I. Perhaps even more impressive was the mentorship Danowski did with attackman Jack Bruckner in his first year at the position. A lifetime midfielder, Bruckner made the switch and ranked third on the team in scoring with 47 goals and 13 assists for 60 points. Overall, in 2015, Duke’s attacking trio of Guterding, Bruckner and Matheis accounted for 42 percent of the Blue Devils’ points.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDuke’s offense flourished early in Danowski's coaching career, ranking second and third nationally in scoring in 2014 and 2013, respectively. His second season surpassed his debut in 2013 as the Blue Devils offense finished the year ranked second nationally in scoring offense (14.85), assists per game (9.0) and points per game (23.85). Under Danowski’s tutelage, Wolf completed his career in record-setting fashion. Wolf, a 2014 Tewaaraton Award finalist, became the first Blue Devil and ACC player overall to score over 100 points in a season with 64 goals and 39 assists for 103 points. He finished his illustrious career with 304 points to rank second in Duke history, only behind his mentor Danowski. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cstrong>Danowski One of the All-Time Great Blue Devils\u003C\u002Fstrong>\u003Cbr \u002F>\r\nAs a player, Matt Danowski remains at the top of the Duke records book and near the top of the NCAA records book. He is still Duke’s all-time leading scorer with 353 career points and tops in assists at 183. Matt is one of four Duke players to rank in the top 10 in career goals, assists and points.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDanowski joined the staff after a stellar career in which he led the Blue Devils to three NCAA semifinal berths, two national runner-up finishes, two ACC Tournament Championships and a 63-18 overall record. The 2007 consensus National Player of the Year as the recipient of both the Tewaaraton Trophy and the USILA Lt. Raymond J. Enners Award, Danowski finished his career with a NCAA record 353 points from 170 goals and 183 assists.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nPeppered throughout the ACC and NCAA records books, Danowski collected nearly every award possible during his illustrious collegiate career. He was a three-time USILA first team All-American, three-time Tewaaraton Trophy finalist and three-time ACC Player of the Year selection and is one of just two players in NCAA history to score 90-plus points in multiple seasons. In addition, he twice won the USILA Lt. Col. J.I. Turnbull Award as the nation’s top attackman and is one of three players in ACC history to earn the ACC Rookie of the Year and ACC Player of the Year accolades during his career.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nAfter graduation, Danowski was selected second overall in the 2008 Major League Lacrosse draft. He is a four-time MLL All-Star and was named to the All-MLL team in 2010 and 2011. He played for the expansion Charlotte Hounds of the MLL and was named to the All-MLL squad after a stellar 2013 season in which he led the Hounds to the MLL Championship game. Danowski currently plays for Chrome LC of the Premier Lacrosse League. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn 2024, Danowski was enshrined into the Duke Athletics Hall of Fame alongside his father. One year later, the Blue Devil great earned the highest honor in being inducted into the National Lacrosse Hall of Fame. He is among three Blue Devil players to earn that distinction.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nDanowski, a history major, earned a Bachelor of Arts degree in 2007 and completed his master’s degree in liberal studies in 2009. He is married to former Duke women’s lacrosse player Virginia Crotty. The couple married October 11, 2014 in Durham, N.C. They reside in Durham with their two daughters Caroline and Louise and son John.\u003C\u002Fp>\r\n",{"staff_title":5888,"staff_email":5889,"staff_phone":5890,"staff_twitter":-1},"matthew.danowski@duke.edu",127,[5920,5921,5922,5923,5924,5925,5926,5927,5928,5929,5930],{"platformName":685,"userName":12,"url":12,"icon":4157,"oldIcon":4578},{"platformName":692,"userName":12,"url":12,"icon":4150,"oldIcon":4580},{"platformName":679,"userName":12,"url":12,"icon":4164,"oldIcon":4582},{"platformName":3459,"userName":12,"url":12,"icon":4584,"oldIcon":4585},{"platformName":4589,"userName":12,"url":12,"icon":4587,"oldIcon":4588},{"platformName":4593,"userName":12,"url":12,"icon":4591,"oldIcon":4592},{"platformName":4597,"userName":12,"url":12,"icon":4595,"oldIcon":4596},{"platformName":4601,"userName":12,"url":12,"icon":4599,"oldIcon":4600},{"platformName":4605,"userName":12,"url":12,"icon":4603,"oldIcon":4604},{"platformName":4609,"userName":12,"url":12,"icon":4607,"oldIcon":4608},{"platformName":4613,"userName":12,"url":12,"icon":4611,"oldIcon":4612},{"id":5932,"title":5933,"firstName":5934,"lastName":5935,"image":5936,"sport":5940,"positionShort":-1,"call_to_action":-1,"bio":5941,"twitter":18,"images":12,"displayFields":5942,"latestBioId":5932,"email":5943,"phone":5892,"url":12,"staffId":5944,"socialMediaR":5945,"custom1":18,"custom2":18,"custom3":18,"custom4":18},5326,"Assistant Coach","Ron","Caputo",{"altText":5937,"url":5938,"absoluteUrl":5939,"creditName":12,"mediaCaption":12,"title":5937},"Ron Caputo","\u002Fimages\u002F2012\u002F7\u002F17\u002FXYSEZAHOKJPNFDK.20120717140503.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2012\u002F7\u002F17\u002FXYSEZAHOKJPNFDK.20120717140503.jpg",{"id":235,"title":108,"shortDisplay":245,"shortName":248,"abbrev":245,"facebookPage":-1,"globalSportGender":158,"globalSportId":247,"globalSportShortName":-1,"globalSportNameSlug":249,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"\u003Cp>One of the great minds in collegiate lacrosse, Ron Caputo is in his 17th season as an assistant coach at Duke. Caputo currently works closely with the Duke defense and faceoff specialists after spending 10 seasons as the leader of the midfielders and faceoff specialists. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn his 16 seasons with the Blue Devils, Duke has posted a 223-71 record, captured five ACC titles, advanced to the NCAA Semifinals 11 times and ultimately won the 2010, 2013 and 2014 national championships.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nUnder Caputo Duke's offense and defense has flourished. Since Caputo took over the reins of the Duke defense in 2018, the Blue Devils have ranked in the top three in scoring defense in the high-powered ACC five times. Five Blue Devil defensemen have earned first team All-Americans since 2018 and JT Giles-Harris captured the USILA Defenseman of the Year award in 2021. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nWorking with the midfield and offensive unites from 2008-17, the Blue Devils turned in some of the best midfield performances in NCAA lacrosse history. Duke had eight first team All-American midfielders in that span and 22 overall All-America honors. The Blue Devils were among the top 10 nationally in scoring for five straight seasons (2013-17), while seven of the midfielders he mentored finished his career with at least 100 career points. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nWorking closely with the faceoff specialists, Duke has had great success at the X under Caputo's watch with All-Americans CJ Costabile and Brendan Fowler, Kyle Rowe and currently Jake Naso. In 2012, Caputo helped mentor Costabile and Fowler to above .500 faceoff percentages as they finished with .526 and .604 win percentages at the X, respectively. In 2013, Fowler took it one step further as he established a NCAA single season record for faceoffs won with 339. He picked up the ACC Defensive Player of the Year honor as well as being named the NCAA Championship Most Outstanding player after winning 20-of-28 faceoffs in the title game. Naso emerged as one of the premier specialists in 2023 and is on pace to break Fowler's career wins record. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn 2023, the Blue Devils featured the ACC’s second-ranked scoring defense at 10.89 goals allowed per game. Close defensemen Wilson Stephenson and Kenny Brower all ranked in the top 10 in the ACC in caused turnovers per game with Carpenter coming in 14th. Brower garnered All-ACC and First Team All-America honors. Junior Jake Naso had a career year, leading the ACC in ground balls per game (8.63\u002Fgm) and faceoff percentage (.620) en route to First Team All-America honors. His 315 faceoff victories rank fifth in NCAA single-season history and second at Duke. He took 508 faceoffs - the fourth most in a season in NCAA history. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn 2021, the Blue Devils ranked second in the ACC and 19th nationally at 10.24 goals allowed per game. With Caputo as the leader of the defensive corps, JT Giles-Harris won the William C. Schmeisser Defensive Player of the Year award. Brower also had a breakout sophomore season, drawing the opponent’s top attackman in games. Carpenter garnered USILA All-America third team after leading non-faceoff specialists in ground balls and helping lead the defensive effort away from the goal.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nAdditionally, Naso shined at the faceoff dot in 2021 with a .629 win percentage en route to honorable mention All-America recognition. \u003Cbr \u002F>\r\nIn the shortened 2020 season, Caputo mentored Duke’s youngest defensive corps in his tenure. The Blue Devils finished 6-2 overall as Caputo’s close defense featured a pair of first-time starters. The group, along with a young collection of longstick midfielders and a veteran group of short stick defenseman, steadily improved to finish with a goals against average of 10.97. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn 2019, his second season working with the defense, Caputo mentored the dynamic duo of JT Giles-Harris and Cade Van Raaphorst to first team All-America honors and Giles-Harris to the ACC Defensive Player of the Year award. As a defensive unit, Duke led the ACC and ranked seventh nationally in allowing 9.61 goals per game. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nCaputo transitioned to working with the defense in 2018 and the Blue Devils proceeded to post their best performance since 2009. They ranked 12th nationally with an 8.39 goals against average, the lowest by a Duke squad since 2009. Sophomore Cade Van Raaphorst garnered All-America third team recognition under his watch, while goalkeeper Danny Fowler was honorable All-America. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn his nine seasons with the Duke midfield, the Blue Devils ranked among the top 11 in scoring offense in every year and was among the top six in eight of those, including the No. 4 spot in 2015 and 2016. Caputo mentored many of Duke’s talented midfield units, including the trio of Deemer Class, Myles Jones and Christian Walsh that set the Duke record for goals by a midfield unit. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nThe 2015 and 2016 seasons featured the dynamic duo of Myles Jones and Deemer Class at midfield. One season after a record-breaking performance from the 2014 midfield line, the tandem picked up right where they left off in 2014. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn 2015, Jones broke the career and single-season records for points by a Duke midfielder and earned the national Midfielder of the Year award from the USILA. Class ranked fourth on the team in points en route to earning second team All-America recognition. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nJones and Class followed that up in 2016 by climbing both the Duke and NCAA records book. Jones became the first midfielder in NCAA history to record 100 career goals and 100 career assists, finishing with 231 career points. Class became the first midfielder in Duke history and ninth in NCAA history to record 50 goals in a season. He joined Jones as the only two midfielders at Duke to record 100 career goals and 200 career points. On the awards circuit, Jones captured his second midfielder of the year honor and Class earned his second first-team All-America accolade.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn 2014, Caputo mentored arguably the most talented midfield group in Duke’s history. The trio of Class, Jones and Christian Walsh combined for 97 goals and 79 assists for a midfield record 176 points. Class’ and Jones’ 65 and 63 respective points both were a program-best. Class went on to earn first team All-America honors. Overall, Duke ranked second nationally in scoring offense with 14.85 goals per game.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nPerhaps even more impressive in 2013 was the play of Duke’s midfield. The Blue Devils’ two midfield lines combined for 223 of Duke’s 464 points and 132 of the 295 goals in 2013. Senior David Lawson flourished in his final season, earning All-ACC and first team All-American, while Jake Tripucka and Josh Offit also both garnered All-American accolades. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn 2012 with Caputo guiding the group again, midfielder Robert Rotanz had a record-setting season, registering 40 goals and earning USILA All-America first team honors. His 40 tallies are the most by a Duke midfielder in program history. In addition, Justin Turri earned USILA All-America honorable mention honors after netting 19 goals and 32 points overall. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nComing off the national championship in 2010 and returning just 48 percent of its scoring, Duke finished 2011 ranked sixth in scoring offense with 12.2 goals per game and had three midfielders with at least 25 points on the year. Turri earned USILA All-America second team honors, while Rotanz captured an honorable mention nod.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn 2010, the Blue Devils won 54.5 percent of their restarts to rank 13th nationally, while senior Sam Payton was 14th individually. Offensively, Duke ranked second in scoring offense with 13.45 goals per game. The Blue Devils also ranked second in assists per game (8.35) and points per game (21.8) under Caputo’s watch.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn Caputo’s inaugural season with the Blue Devils, Duke led the nation in scoring offense with 15.2 goals per game. The squad won an NCAA record 18 games and advanced to the NCAA Semifinals for the second consecutive season under his assistance as the Blue Devils featured the top two individual scorers in NCAA history in Matt Danowski and Zack Greer.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nPrior to his arrival at Duke, Caputo spent four seasons (2003-06) on the Hofstra University men’s lacrosse staff as an assistant coach. He joined the Pride in 2004 as a volunteer assistant coach for current Blue Devil head coach John Danowski, who served as the head coach at Hofstra from 1986-2006, as the Pride compiled an overall record of 35-28 and a 14-9 mark in Colonial Athletic Conference play, during his tenure.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nIn 2006, Caputo worked alongside Danowski to help lead Hofstra to an overall record of 17-2, a mark that included a perfect 6-0 mark versus CAA opponents, and a final national ranking of No. 2. The Pride won the CAA Championship and reached the NCAA Quarterfinals, while setting a school record for wins and winning percentage (.895).\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nBefore his stint at Hofstra, Caputo served as a varsity assistant lacrosse coach from 1997-2003 at Syosset (N.Y.) High School, where he coached Blue Devil teammates and brothers Dan and Chris Loftus. A 1991 graduate of the University of Scranton, Caputo led Syosset to three county semifinal appearances and one Nassau County Championship game berth.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nCaputo is married to the former Randi Heller of Farmingdale, N.Y., and the couple has four children, Samantha, Owen, Jake and Jayme.  Owen played five seasons in the midfield with the Blue Devils, while Jake is a current member of the Duke men’s lacrosse team, while Samantha played women's lacrosse at East Carolina. The family resides in Holly Springs, N.C.\u003C\u002Fp>\r\n",{"staff_title":5888,"staff_email":5889,"staff_phone":5890,"staff_twitter":-1},"ronald.caputo@duke.edu",120,[5946,5947,5948,5949,5950,5951,5952,5953,5954,5955,5956],{"platformName":685,"userName":12,"url":12,"icon":4157,"oldIcon":4578},{"platformName":692,"userName":12,"url":12,"icon":4150,"oldIcon":4580},{"platformName":679,"userName":12,"url":12,"icon":4164,"oldIcon":4582},{"platformName":3459,"userName":12,"url":12,"icon":4584,"oldIcon":4585},{"platformName":4589,"userName":12,"url":12,"icon":4587,"oldIcon":4588},{"platformName":4593,"userName":12,"url":12,"icon":4591,"oldIcon":4592},{"platformName":4597,"userName":12,"url":12,"icon":4595,"oldIcon":4596},{"platformName":4601,"userName":12,"url":12,"icon":4599,"oldIcon":4600},{"platformName":4605,"userName":12,"url":12,"icon":4603,"oldIcon":4604},{"platformName":4609,"userName":12,"url":12,"icon":4607,"oldIcon":4608},{"platformName":4613,"userName":12,"url":12,"icon":4611,"oldIcon":4612},{"id":5958,"title":5933,"firstName":5959,"lastName":5960,"image":5961,"sport":5966,"positionShort":-1,"call_to_action":-1,"bio":5967,"twitter":18,"images":12,"displayFields":5968,"latestBioId":5958,"email":5969,"phone":18,"url":12,"staffId":5970,"socialMediaR":5971,"custom1":18,"custom2":18,"custom3":18,"custom4":18},5328,"Kevin","Unterstein",{"altText":5962,"url":5963,"absoluteUrl":5964,"creditName":5884,"mediaCaption":12,"title":5965},"Kevin Unterstein head shot","\u002Fimages\u002F2024\u002F7\u002F12\u002FUnterstein_Kevin_HS.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2024\u002F7\u002F12\u002FUnterstein_Kevin_HS.jpg","Kevin Unterstein_2024",{"id":235,"title":108,"shortDisplay":245,"shortName":248,"abbrev":245,"facebookPage":-1,"globalSportGender":158,"globalSportId":247,"globalSportShortName":-1,"globalSportNameSlug":249,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"Kevin Unterstein joined the Duke men's lacrosse staff\u003Cstrong> \u003C\u002Fstrong>as an assistant coach in July 2024. He works closely with the Blue Devils defensive unit and faceoff specialists.  \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nUnterstein arrived in Durham after spending six seasons at University of North Carolina.In addition to coaching in the collegiate ranks, Unterstein serves as the defensive coordinator for the New York Atlas of the Premier Lacrosse League. He retired from professional lacrosse in January of 2022 following a 14-year career.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n“We are thrilled to have Kevin, his wife Melissa and daughters Noa and Charlee join the Duke family,” said Danowski. “Obviously my first impression of Kevin is as a player with a phenomenal career as an undergraduate, a professional and on the international level. His resume is incredible – 12 years in the MLL, three years in in the PLL and winning a gold medal with the United States in Israel in 2018. What’s more impressive is his coaching resum&eacute; – Princeton, Denver, Hofstra and North Carolina and now for the New York Atlas of the PLL. I don’t know if we could find a more qualified, more experienced or better person than Kevin. He is a great addition to our program.”\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nUnterstein joined the North Carolina staff in August of 2018 as the defensive coordinator. Since arriving in Chapel Hill prior to the 2019 season, Unterstein has mentored five USILA First-, Second-, or Third Team All-Americans and five All-Atlantic Coast Conference honorees on the defensive side of the ball. North Carolina’s scoring defense ranked third in the ACC this past season and 19th nationally.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\"I am honored and thrilled to have the privilege of joining the coaching staff of the men’s lacrosse program at Duke University,” said Unterstein. “I am grateful to Coach Danowski for the amazing opportunity to coach alongside him, Matt Danowski and Ron Caputo. Their dedication and success have built a legendary program, and I am humbled to play a role in furthering its legacy.\"\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nPrior to his arrival in Chapel Hill, Unterstein spent eight years on the Hofstra men’s lacrosse staff, including five years as associate head coach. Recently, as a player, he was a member of the gold-medal winning United States Men’s National Team that competed in the 2018 FIL World Championships in Israel as well as a member of the New York Lizards in Major League Lacrosse (MLL).\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nA 2008 graduate of Hofstra with a degree in sociology, Unterstein played for Danowski for two seasons prior to Danowski’s arrival at Duke in the summer of 2006. Unterstein was a standout short-stick defensive midfielder for the Pride, earning USILA All-America honorable mention honors in 2007. \u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nHe recorded a team-leading 70 ground balls while helping to guide the Pride to the CAA title and the NCAA Tournament his senior season. For his efforts, he was an All-CAA first team selection and was named the CAA Defensive Player of the Year and the CAA Championship Tournament Most Valuable Player.  As a junior in 2007, in addition to his All-America accolade, Unterstein  was named to the All-CAA second team and the All-CAA Tournament team. In his final season with Danowski, he and his twin brother, Mike, and their older brother, Chris, combined to help lead Hofstra to a 17-2 record, a No. 2 national ranking and a No. 3 seed in the NCAA Tournament. He was also named to the All-CAA Rookie Team as a freshman.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nFollowing his playing career at Hofstra, the Shoreham, N.Y., native was an assistant legendary coach Bill Tierney at Princeton in 2009, working with the defense and faceoff specialists. He followed Tierney to Denver in 2010 to help coordinate the Pioneers’ man-down unit and work specifically with the defensive midfielders and with assistant coach Trevor Tierney with the defense and the overall face-off game.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nA native of Shoreham, N.Y., he was a high school All-America at Shoreham-Wading River High, where he was part of four Suffolk County championships and one state championship.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\nUnterstein and his wife Melissa are proud parents of daughters Noa and Charlee.\u003Cbr \u002F>\r\n ",{"staff_title":5888,"staff_email":5889,"staff_phone":5890,"staff_twitter":-1},"kevin.unterstein@duke.edu",1279,[5972,5973,5974,5975,5976,5977,5978,5979,5980,5981,5982],{"platformName":685,"userName":12,"url":12,"icon":4157,"oldIcon":4578},{"platformName":692,"userName":12,"url":12,"icon":4150,"oldIcon":4580},{"platformName":679,"userName":12,"url":12,"icon":4164,"oldIcon":4582},{"platformName":3459,"userName":12,"url":12,"icon":4584,"oldIcon":4585},{"platformName":4589,"userName":12,"url":12,"icon":4587,"oldIcon":4588},{"platformName":4593,"userName":12,"url":12,"icon":4591,"oldIcon":4592},{"platformName":4597,"userName":12,"url":12,"icon":4595,"oldIcon":4596},{"platformName":4601,"userName":12,"url":12,"icon":4599,"oldIcon":4600},{"platformName":4605,"userName":12,"url":12,"icon":4603,"oldIcon":4604},{"platformName":4609,"userName":12,"url":12,"icon":4607,"oldIcon":4608},{"platformName":4613,"userName":12,"url":12,"icon":4611,"oldIcon":4612},[5984,6009,6036,6063],{"id":5985,"title":5986,"firstName":5987,"lastName":5988,"image":5989,"sport":5992,"positionShort":-1,"call_to_action":-1,"bio":5993,"twitter":18,"images":12,"displayFields":5994,"latestBioId":5985,"email":5995,"phone":18,"url":12,"staffId":5996,"socialMediaR":5997,"custom1":18,"custom2":18,"custom3":18,"custom4":18},269,"Senior Associate Director of Sports Performance\u002FOlympic Sports","Carl","Christensen",{"altText":18,"url":5990,"absoluteUrl":5991,"creditName":12,"mediaCaption":12,"title":12},"\u002Fimages\u002F2023\u002F3\u002F29\u002FCarl_Christensen.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2023\u002F3\u002F29\u002FCarl_Christensen.jpg",{"id":235,"title":108,"shortDisplay":245,"shortName":248,"abbrev":245,"facebookPage":-1,"globalSportGender":158,"globalSportId":247,"globalSportShortName":-1,"globalSportNameSlug":249,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"\u003Cp>Carl Christensen is the Senior Associate Director of Sports Performance for Olympic Sports at Duke University, a position he assumed in 2024. Christensen designs and implements all aspects for sports performance programs for the men’s lacrosse and swimming & diving teams.\u003C\u002Fp>\r\n\r\n\u003Cp>Christensen joined the Duke athletic department in January 2009 as the Assistant Director for Sports Performance for Olympic Sports. Before Duke, he served as the associate head strength and conditioning coach at Missouri State University, focusing on Olympic Sports. His earlier experiences include roles at the University of Arkansas and as a graduate assistant strength and conditioning coach at the University of Wyoming.\u003C\u002Fp>\r\n\r\n\u003Cp>Originally from Iowa, Christensen earned his Bachelor of Arts from Chadron State College in 2003 and his Master of Science from the University of Wyoming in 2006. He holds certifications from the National Strength and Conditioning Association and the United States Weightlifting Organization.\u003Cbr \u002F>\r\n\u003Cbr \u002F>\r\n\u003Cem>Updated October 24, 2025\u003C\u002Fem>\u003Cbr \u002F>\r\n \u003C\u002Fp>\r\n",{"staff_title":5888,"staff_email":5889,"staff_phone":5890,"staff_twitter":-1},"cc240@duke.edu",465,[5998,5999,6000,6001,6002,6003,6004,6005,6006,6007,6008],{"platformName":685,"userName":12,"url":12,"icon":4157,"oldIcon":4578},{"platformName":692,"userName":12,"url":12,"icon":4150,"oldIcon":4580},{"platformName":679,"userName":12,"url":12,"icon":4164,"oldIcon":4582},{"platformName":3459,"userName":12,"url":12,"icon":4584,"oldIcon":4585},{"platformName":4589,"userName":12,"url":12,"icon":4587,"oldIcon":4588},{"platformName":4593,"userName":12,"url":12,"icon":4591,"oldIcon":4592},{"platformName":4597,"userName":12,"url":12,"icon":4595,"oldIcon":4596},{"platformName":4601,"userName":12,"url":12,"icon":4599,"oldIcon":4600},{"platformName":4605,"userName":12,"url":12,"icon":4603,"oldIcon":4604},{"platformName":4609,"userName":12,"url":12,"icon":4607,"oldIcon":4608},{"platformName":4613,"userName":12,"url":12,"icon":4611,"oldIcon":4612},{"id":6010,"title":6011,"firstName":6012,"lastName":6013,"image":6014,"sport":6018,"positionShort":-1,"call_to_action":-1,"bio":6019,"twitter":18,"images":12,"displayFields":6020,"latestBioId":6010,"email":6021,"phone":6022,"url":12,"staffId":6023,"socialMediaR":6024,"custom1":18,"custom2":18,"custom3":18,"custom4":18},268,"Associate Director of Athletic Medicine","Joe","Ferraro",{"altText":6015,"url":6016,"absoluteUrl":6017,"creditName":12,"mediaCaption":12,"title":12},"Duke Athletics Staff Headshots. - September 9, 2019","\u002Fimages\u002F2019\u002F12\u002F9\u002FFerraro_Joe_2019.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2019\u002F12\u002F9\u002FFerraro_Joe_2019.jpg",{"id":235,"title":108,"shortDisplay":245,"shortName":248,"abbrev":245,"facebookPage":-1,"globalSportGender":158,"globalSportId":247,"globalSportShortName":-1,"globalSportNameSlug":249,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"\u003Cp>Joe Ferraro has been a member of the Duke Athletic Department since July 1995 and currently serves as an Associate Director of Athletic Medicine.\u003C\u002Fp>\r\n\r\n\u003Cp>Originally from Cockeysville, Md., Ferraro is responsible for overseeing the health care of the Duke men's lacrosse program. His tenure with Duke began in the fall of 1995, following his role as the Acting Head Athletic Trainer at Guilford College earlier that year.\u003C\u002Fp>\r\n\r\n\u003Cp>Ferraro holds a Bachelor of Science degree in Justice & Policy Studies from Guilford College, obtained in 1993. He furthered his education by earning a Master of Science degree in Injury Prevention & Management from Springfield College in 1999.\u003C\u002Fp>\r\n\r\n\u003Cp>He is married to Judy Jo Gibbs of Onnadaga, Mich., and together they have three children: J.D., Mary and Lizzie\u003C\u002Fp>\r\n\r\n\u003Cp>\u003Cem>Updated September 6, 2024\u003C\u002Fem>\u003C\u002Fp>\r\n",{"staff_title":5888,"staff_email":5889,"staff_phone":5890,"staff_twitter":-1},"joseph.ferraro@duke.edu","(919) 668-5743",433,[6025,6026,6027,6028,6029,6030,6031,6032,6033,6034,6035],{"platformName":685,"userName":12,"url":12,"icon":4157,"oldIcon":4578},{"platformName":692,"userName":12,"url":12,"icon":4150,"oldIcon":4580},{"platformName":679,"userName":12,"url":12,"icon":4164,"oldIcon":4582},{"platformName":3459,"userName":12,"url":12,"icon":4584,"oldIcon":4585},{"platformName":4589,"userName":12,"url":12,"icon":4587,"oldIcon":4588},{"platformName":4593,"userName":12,"url":12,"icon":4591,"oldIcon":4592},{"platformName":4597,"userName":12,"url":12,"icon":4595,"oldIcon":4596},{"platformName":4601,"userName":12,"url":12,"icon":4599,"oldIcon":4600},{"platformName":4605,"userName":12,"url":12,"icon":4603,"oldIcon":4604},{"platformName":4609,"userName":12,"url":12,"icon":4607,"oldIcon":4608},{"platformName":4613,"userName":12,"url":12,"icon":4611,"oldIcon":4612},{"id":6037,"title":6038,"firstName":6039,"lastName":6040,"image":6041,"sport":6045,"positionShort":-1,"call_to_action":-1,"bio":6046,"twitter":18,"images":12,"displayFields":6047,"latestBioId":6048,"email":6049,"phone":18,"url":12,"staffId":6050,"socialMediaR":6051,"custom1":18,"custom2":18,"custom3":18,"custom4":18},271,"Assistant Director of Sports Nutrition","Kerrin","Meseck",{"altText":6042,"url":6043,"absoluteUrl":6044,"creditName":12,"mediaCaption":12,"title":12},"Kerrin Meseck headshot","\u002Fimages\u002F2023\u002F8\u002F24\u002FKerrin_Meseck.jpg","https:\u002F\u002Fgoduke.com\u002Fimages\u002F2023\u002F8\u002F24\u002FKerrin_Meseck.jpg",{"id":235,"title":108,"shortDisplay":245,"shortName":248,"abbrev":245,"facebookPage":-1,"globalSportGender":158,"globalSportId":247,"globalSportShortName":-1,"globalSportNameSlug":249,"instagramName":-1,"nonSport":-1,"pinterestName":-1,"ticketsLink":12,"twitterName":-1,"youtubeName":-1,"rosterId":12,"scheduleId":12,"displayOpponentHistory":-1},"Kerrin Meseck joined the Duke A
